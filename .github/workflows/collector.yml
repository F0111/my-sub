name: Hourly V2Ray Collector
on:
schedule:
- cron: "0 * * * *"
workflow_dispatch:
push:
branches:
- main
permissions:
contents: write
jobs:
collect-and-verify:
runs-on: ubuntu-latest
timeout-minutes: 15
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.11"
- name: Install dependencies
run: |
python -m pip install --upgrade pip
pip install aiohttp
- name: Run Collector
run: |
python collector.py
- name: Commit and Push
run: |
git config --global user.name "github-actions[bot]"
git config --global user.email "github-actions[bot]@users.noreply.github.com"
git add sub/
git diff --staged --quiet || (git commit -m "Auto-update verified configs" && git pull --rebase origin main && git push)
