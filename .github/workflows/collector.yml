name: Hourly V2Ray & Sing-box Collector
on:
اجرای خودکار رأس هر ۱ ساعت
schedule:
- cron: “0 * * * *”
امکان اجرای دستی با یک کلیک از تب Actions گیت‌هاب
workflow_dispatch:
اجرا هنگام تغییر در کد اصلی یا لیست کانال‌ها
push:
branches:
- main
paths:
- “collector.py”
- “channels.txt”
- “.github/workflows/collector.yml”
permissions:
contents: write
jobs:
collect-and-verify:
runs-on: ubuntu-latest
timeout-minutes: 15
steps:
- name: دریافت کدهای ریپازیتوری (Checkout)
uses: actions/checkout@v4
- name: راه‌اندازی پایتون ۳.۱۱
uses: actions/setup-python@v5
with:
python-version: “3.11”
cache: “pip”
- name: نصب کتابخانه‌های مورد نیاز
run: |
python -m pip install —upgrade pip
pip install aiohttp telethon
- name: اجرای موتور جمع‌آوری، حذف تکراری‌ها و تست سرورها
env:
# این متغیرها اختیاری هستند و فقط برای اسکرپ کردن گروه‌های خصوصی/بدون پیش‌نمایش وب کاربرد دارند
TG_API_ID: ${{ secrets.TG_API_ID }}
TG_API_HASH: ${{ secrets.TG_API_HASH }}
TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
run: |
python collector.py
- name: ثبت و انتشار فایل‌های اشتراک جدید در ریپازیتوری
run: |
git config —global user.name “github-actions[bot]”
git config —global user.email “github-actions[bot]@users.noreply.github.com”
git add sub/
git diff —staged —quiet || (git commit -m “⚡ Auto-update verified configs ($(date -u +’%Y-%m-%d %H:%M UTC’))” && git push)
